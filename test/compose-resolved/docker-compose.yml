# ===========================================================================
# FileGator for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : filegator/filegator:v7.16.9 (Docker Hub, used unmodified)
#                  -> https://github.com/filegator/filegator
#
# Ports   : host 8063 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/filegatordocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the two data folders are bind mounts, so on a fresh install the
#           image's own private/users.json.blank and private/logs/ are hidden
#           and FileGator refuses to render ("Folder not writable:
#           /private/logs/"). The small shell wrapper below creates those
#           folders, seeds the upstream default accounts once, and then runs
#           the image's own docker-php-entrypoint + Apache. Nothing else in the
#           image is touched.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  filegatordocker:
    image: filegator/filegator:v7.16.9
    container_name: filegatordocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # FileGator for TOS - first-start seeding wrapper.
        #
        # FileGator keeps its accounts in private/users.json and its log in
        # private/logs/app.log, and both directories are bind-mounted from the NAS data
        # folder. On a fresh install those mounts are *empty*, which hides the two files
        # the image ships inside private/ (users.json.blank and logs/.gitignore) and the
        # application cannot boot:
        #
        #   Folder not writable: /private/logs/
        #   Warning: copy(/var/www/filegator/private/users.json.blank): Failed to open stream
        #
        # The web page therefore answers with that message instead of the file manager.
        # This wrapper creates the missing folders and seeds the default account file
        # once, keeps everything on later starts (so users, ACLs and the log survive an
        # update), then hands over to the image's own entrypoint and Apache.
        #
        # The seeded accounts are the upstream defaults: admin/admin123 (role admin) and
        # guest with no password and no permissions. The admin password must be changed
        # on the first login; PRIVACY.md and README.md say so as well.
        set -u

        PRIVATE=/var/www/filegator/private

        # The installer creates the mount points for uid 1000; make sure they exist when
        # the container is started by hand.
        mkdir -p "$$PRIVATE/logs" "$$PRIVATE/tmp" /var/www/filegator/repository

        # Key material stays owner-only: login events (usernames + client IPs) must not be
        # world readable on the NAS, and neither must the bcrypt hashes.
        chmod 700 "$$PRIVATE/logs" "$$PRIVATE/tmp" 2>/dev/null || true

        if [ ! -s "$$PRIVATE/users.json" ]; then
            cat > "$$PRIVATE/users.json" <<'JSON'
        {"1":{"username":"admin","name":"Admin","role":"admin","homedir":"\/","permissions":"read|write|upload|download|batchdownload|zip|chmod","password":"$$2y$$10$$Nu35w4pteLfc7BDCIkDPkecjw8wsH8Y2GMfIewUbXLT7zzW6WOxwq"},"2":{"username":"guest","name":"Guest","role":"guest","homedir":"\/","permissions":"","password":""}}
        JSON
            chmod 660 "$$PRIVATE/users.json" 2>/dev/null || true
            echo "filegatordocker: created $$PRIVATE/users.json with the upstream default accounts."
            echo "filegatordocker: log in as admin/admin123 and change the password immediately."
        fi

        exec docker-php-entrypoint apache2-foreground
    ports:
      - "8063:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/filegatordocker/private:/var/www/filegator/private
      - /Volume1/DockerAppData/filegatordocker/repository:/var/www/filegator/repository
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8063
    protocol: http
